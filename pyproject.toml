[project]
name = "sudoku-board"
version = "0.1.0"
description = "A validating parser, solver, and pretty printer for sudoku boards"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "maryw6" }]

[project.scripts]
sudoku-board = "sudoku_board.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
